# Line coverage is a merge gate. Both statuses fail under 90%.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: false
