summary: "A Windows instrument for fine-tuning runs: it draws every stored sample from a folder of run records, writes a report, and gives a local model a workbench. A Rust core library with an egui desktop app on top."
boundaries:
  - name: .cargo
    globs:
      - .cargo/**
    role: config
  - name: .github
    globs:
      - .github/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: packaging
    globs:
      - packaging/**
    role: data
  - name: root
    globs:
      - "*"
    role: config
  - name: runforge
    globs:
      - crates/runforge/**
    role: code
  - name: runforge-core
    globs:
      - crates/runforge-core/**
    role: code
  - name: samples
    globs:
      - samples/**
    role: data
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: site
    globs:
      - site/**
    role: site
